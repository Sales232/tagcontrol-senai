{% extends "base.html" %}
{% block title %}{{ "Editar" if peca else "Nova" }} peça{% endblock %}
{% block content %}
<h1>{{ "Editar" if peca else "Nova" }} peça</h1>
<form method="post">
    <label>Código
        <input type="text" name="codigo" value="{{ peca.codigo if peca else '' }}" required maxlength="50">
    </label><br>
    <label>Descrição
        <input type="text" name="descricao" value="{{ peca.descricao if peca else '' }}" required maxlength="200">
    </label><br>
    <label>Código de barras
        <input type="text" name="codigo_barras" value="{{ peca.codigo_barras if peca else '' }}" required maxlength="50">
    </label><br>
    <button type="submit">Salvar</button>
</form>
{% endblock %}
