{% extends "base.html" %}
{% block title %}{{ "Editar" if pedido else "Novo" }} pedido | TagControl{% endblock %}
{% block content %}
<section class="page-heading">
    <div>
        <p class="eyebrow">Expedição / Pedidos</p>
        <h1>{{ "Editar pedido" if pedido else "Novo pedido" }}</h1>
        <p>Defina o código para identificar este pedido.</p>
    </div>
</section>

<section class="panel form-panel">
    <form method="post" class="stacked-form">
        <label class="form-field">
            <span>Código</span>
            <input type="text" name="codigo" value="{{ pedido.codigo if pedido else '' }}" required maxlength="50">
        </label>
        <div class="form-actions">
            <button type="submit">Salvar pedido</button>
            <a class="button button-secondary" href="{{ url_for('pedidos.listar') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
